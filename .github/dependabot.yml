# One grouped PR a week (Mondays) covering pip, the Dockerfile base image
# and GitHub Actions, opened against dev so it follows the normal
# dev -> main flow. Dependabot *security-update* PRs are left off in the
# repo settings because those always target main.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
    target-branch: dev

updates:
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # The stack is Python 3.11; moving off it is a deliberate change.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
